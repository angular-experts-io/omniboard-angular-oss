name: Batch Analyze

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Omniboard connection
        run: npm exec -- omniboard test-connection --silent
        env:
          OMNIBOARD_API_KEY: ${{ secrets.OMNIBOARD_API_KEY }}

      - name: Configure repository SSH access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CHECKOUT_ACTION_GITHUB_SSH_KEY }}

      - name: Run batch analysis
        run: npm start
        env:
          OMNIBOARD_API_KEY: ${{ secrets.OMNIBOARD_API_KEY }}
